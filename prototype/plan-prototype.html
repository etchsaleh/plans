<div class="wrap" id="app"><div class="bar"><div class="bar-row"></div></div><h1>Plan</h1><p class="muted">Loading…</p></div>

<script>
/* ───────────── Mock catalogue + verifier (simulated checks, no real sites) ───────────── */
const VENUES = [
  { id: "bpma-padel", name: "Battersea Park Millennium Arena", area: "Battersea", cat: "padel", units: 4, price: 52 },
  { id: "rocket-batt", name: "Rocket Padel Battersea", area: "Battersea", cat: "padel", units: 3, price: 60 },
  { id: "hyde-padel", name: "Hyde Park Courts", area: "Hyde Park", cat: "padel", units: 2, price: 44 },
  { id: "regents-padel", name: "Regent's Park Courts", area: "Regent's Park", cat: "padel", units: 2, price: 44 },
  { id: "hyde-tennis", name: "Hyde Park Courts", area: "Hyde Park", cat: "tennis", units: 6, price: 16 },
  { id: "regents-tennis", name: "Regent's Park Courts", area: "Regent's Park", cat: "tennis", units: 5, price: 16 },
  { id: "greenwich-tennis", name: "Greenwich Park Courts", area: "Greenwich", cat: "tennis", units: 4, price: 12 },
  { id: "batt-tennis", name: "Battersea Park Tennis", area: "Battersea", cat: "tennis", units: 6, price: 14 },
  { id: "dishoom-carnaby", name: "Dishoom Carnaby", area: "Soho", cat: "restaurant", units: 1, price: null },
  { id: "bao-soho", name: "Bao Soho", area: "Soho", cat: "restaurant", units: 1, price: null },
  { id: "padella-borough", name: "Padella Borough", area: "Borough", cat: "restaurant", units: 1, price: null },
  { id: "kiln-soho", name: "Kiln", area: "Soho", cat: "restaurant", units: 1, price: null },
];
const CAT_LABEL = { padel: "Padel", tennis: "Tennis", restaurant: "Dinner" };

function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function startTimes(earliest, latest) {
  const toM = (t) => +t.slice(0, 2) * 60 + +t.slice(3);
  const out = [];
  for (let m = Math.ceil(toM(earliest) / 30) * 30; m <= toM(latest); m += 30) out.push(String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"));
  return out;
}
function addMins(t, d) { const m = +t.slice(0, 2) * 60 + +t.slice(3) + d; return String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
/** Simulated verifier: deterministic per venue/date/time/party, plus a salt so a re-check can change answers. */
function mockCheck(plan, salt) {
  const now = Date.now(), out = [];
  const venues = VENUES.filter((v) => v.cat === plan.category && (!plan.areas.length || plan.areas.includes(v.area)));
  const need = plan.category === "restaurant" ? 1 : Math.ceil(plan.partySize / 4);
  for (const v of venues) for (const t of startTimes(plan.earliest, plan.latest)) {
    const h = hash(`${v.id}|${plan.date}|${t}|${plan.partySize}`);
    const free = plan.category === "restaurant" ? (h % 100 < 35 && plan.partySize <= 8 ? 1 : 0) : (h % (v.units + 2));
    if (free < need) continue;
    if (salt && hash(`${salt}|${v.id}|${t}`) % 100 < 22) continue; // taken since the last check
    const total = v.price ? v.price * need * (plan.duration / 60) : null;
    out.push({
      id: "o" + (hash(`${v.id}|${t}`) % 1e8).toString(36),
      venueId: v.id, venue: v.name, area: v.area, start: t, end: addMins(t, plan.duration),
      desc: plan.category === "restaurant" ? `Table for ${plan.partySize}` : `${need} ${plan.category} court${need > 1 ? "s" : ""} · ${plan.duration} min`,
      price: total ? `£${total.toFixed(total % 1 ? 2 : 0)} total` : plan.category === "restaurant" ? "Price on the night" : null,
      terms: plan.category === "restaurant" ? "Cancellation terms unknown" : "Pay on booking · cancellation terms unknown",
      checkedAt: now, source: `simulated://${v.id}?date=${plan.date}&time=${t}&party=${plan.partySize}`,
    });
  }
  return out.slice(0, 8);
}

/* ───────────── Helpers ───────────── */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function londonToday(offsetDays = 0) { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date(Date.now() + offsetDays * 864e5)); }
function fmtDate(d, long) { return new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", long ? { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" } : { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" }); }
function age(ts) { const m = Math.max(0, Math.floor((Date.now() - ts) / 60000)); return { text: m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ago`, older: Date.now() - ts > 15 * 60000 }; }
const COLORS = ["#ff9500", "#34c759", "#5856d6", "#ff2d55", "#00c7be", "#af52de", "#007aff", "#a2845e"];
const avatar = (name, id) => `<div class="avatar" style="background:${COLORS[hash(id || name) % COLORS.length]}">${esc((name || "?").trim().slice(0, 1).toUpperCase())}</div>`;
const shortRef = (id) => String(id).replace(/[^a-z0-9]/gi, "").slice(-6).toUpperCase();
const DEMO_NAMES = ["Sam", "Priya", "Tom", "Aisha", "Jonah", "Mei", "Leo", "Zara"];

/* ───────────── Stores: shared (claude db) or solo (this browser) ───────────── */
const S = { mode: "loading", me: null, myName: "", canWrite: true, plans: [], rsvps: {}, votes: {}, previewFriend: false, note: null };

function soloStore() {
  let data = { plans: {}, rsvps: {}, votes: {} };
  try { data = JSON.parse(localStorage.getItem("plan-proto") || "") || data; } catch {}
  const save = () => { try { localStorage.setItem("plan-proto", JSON.stringify(data)); } catch {} };
  const listeners = new Set();
  const emit = () => { save(); listeners.forEach((f) => f()); };
  return {
    kind: "solo",
    subscribe(fn) { listeners.add(fn); fn(); },
    plans: () => Object.values(data.plans).sort((a, b) => b.createdAt - a.createdAt),
    rsvps: (pid) => data.rsvps[pid] || {},
    votes: (pid) => data.votes[pid] || {},
    async savePlan(p) { data.plans[p.id] = p; emit(); },
    async patchPlan(id, patch) { data.plans[id] = { ...data.plans[id], ...patch, updatedAt: Date.now() }; emit(); },
    async deletePlan(id) { delete data.plans[id]; delete data.rsvps[id]; delete data.votes[id]; emit(); },
    async setRsvp(pid, who, rec) { (data.rsvps[pid] ||= {})[who] = rec; emit(); },
    async setVotes(pid, who, votes) { (data.votes[pid] ||= {})[who] = { votes }; emit(); },
    watchPlan() {}, unwatchPlan() {},
  };
}

function sharedStore(db) {
  const cache = { plans: [], rsvps: {}, votes: {} };
  const listeners = new Set();
  const emit = () => listeners.forEach((f) => f());
  const subs = {};
  const onErr = (e) => { S.note = "Shared data stopped updating (" + e.code + "). Reload to reconnect."; emit(); };
  const loadTimer = setTimeout(() => { if (!S.plansLoaded) { S.note = "Can't reach the shared plans yet. Showing what we have."; emit(); } }, 10000);
  db.collection("plans").orderBy("createdAt", "desc").limit(30).onSnapshot((snap) => {
    cache.plans = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    if (!snap.metadata.fromCache) { S.plansLoaded = true; clearTimeout(loadTimer); if (S.note?.startsWith("Can't reach")) S.note = null; }
    emit();
  }, onErr);
  return {
    kind: "shared",
    subscribe(fn) { listeners.add(fn); fn(); },
    plans: () => cache.plans,
    rsvps: (pid) => cache.rsvps[pid] || {},
    votes: (pid) => cache.votes[pid] || {},
    watchPlan(pid) {
      if (subs[pid]) return;
      subs[pid] = [
        db.collection(`plans/${pid}/rsvps`).onSnapshot((s) => { cache.rsvps[pid] = Object.fromEntries(s.docs.map((d) => [d.id, d.data()])); emit(); }, onErr),
        db.collection(`plans/${pid}/votes`).onSnapshot((s) => { cache.votes[pid] = Object.fromEntries(s.docs.map((d) => [d.id, d.data()])); emit(); }, onErr),
      ];
    },
    unwatchPlan(pid) { (subs[pid] || []).forEach((u) => u()); delete subs[pid]; },
    async savePlan(p) { const { id, ...body } = p; await db.doc(`plans/${id}`).set(body); },
    async patchPlan(id, patch) { await db.doc(`plans/${id}`).update({ ...patch, updatedAt: Date.now() }); },
    async deletePlan(id) { await db.doc(`plans/${id}`).delete(); },
    async setRsvp(pid, who, rec) { await db.doc(`plans/${pid}/rsvps/${who}`).set(rec); },
    async setVotes(pid, who, votes) { await db.doc(`plans/${pid}/votes/${who}`).set({ votes }); },
  };
}

let store = null;

async function boot() {
  let db = null, user = null;
  if (window.claude?.use) {
    const timeout = new Promise((r) => setTimeout(() => r(null), 6000));
    [db, user] = await Promise.all([Promise.race([claude.use("db"), timeout]), Promise.race([claude.use("user"), timeout])]);
  }
  const id = user ? await user.id() : null;
  if (db && id) {
    S.mode = "shared"; S.me = id;
    S.myName = (await user.name()) || "";
    const can = await user.can("data.write");
    S.canWrite = can !== false;
    store = sharedStore(db);
  } else {
    S.mode = "solo"; S.me = "me"; S.myName = "You";
    store = soloStore();
  }
  store.subscribe(render);
  window.addEventListener("hashchange", render);
  setInterval(render, 30000); // re-render only, so "checked X min ago" ticks; no writes
}

/* ───────────── Actions ───────────── */
async function guard(fn) {
  try { await fn(); }
  catch (e) {
    if (e?.code === "invalid_argument" && S.mode === "shared") { S.canWrite = false; S.note = "You can view these shared plans but not change them. Ask the owner for Contributor access, or use the solo demo."; }
    else S.note = "That didn't save: " + (e?.message || e?.code || e);
    render();
  }
}
function viewerId(plan) { return S.previewFriend && plan.organizerId === S.me ? "preview-friend" : S.me; }

async function createPlan(form) {
  const p = {
    id: "p" + uid(), category: form.category, date: form.date, earliest: form.earliest, latest: form.latest,
    duration: +form.duration, partySize: form.partySize, areas: form.areas, notes: form.notes || "",
    status: "CHECKING", options: [], selectedOptionId: null, bookingRef: null, round: 0,
    organizerId: S.me, createdAt: Date.now(), updatedAt: Date.now(),
  };
  await guard(async () => {
    await store.savePlan(p);
    await store.setRsvp(p.id, S.me, { value: "in", nickname: S.myName || "Organiser", at: Date.now() });
    location.hash = p.id;
    setTimeout(() => finishCheck(p.id), 2200);
  });
}
async function finishCheck(id) {
  const p = store.plans().find((x) => x.id === id);
  if (!p || p.status !== "CHECKING") return;
  const options = mockCheck(p, p.round ? "r" + p.round : "");
  // keep option ids stable so votes survive a re-check
  await guard(() => store.patchPlan(id, { options, status: options.length ? (p.selectedOptionId && !options.some((o) => o.id === p.selectedOptionId) ? "RESULTS" : p.selectedOptionId ? "SELECTED" : "RESULTS") : "NO_AVAILABILITY", selectedOptionId: options.some((o) => o.id === p.selectedOptionId) ? p.selectedOptionId : null }));
}
async function recheck(p) { await guard(async () => { await store.patchPlan(p.id, { status: "CHECKING", round: (p.round || 0) + 1 }); setTimeout(() => finishCheck(p.id), 1800); }); }
async function ageChecks(p) { await guard(() => store.patchPlan(p.id, { options: p.options.map((o) => ({ ...o, checkedAt: o.checkedAt - 20 * 60000 })) })); }
async function vote(p, optId, dir) {
  const who = viewerId(p);
  const mine = { ...(store.votes(p.id)[who]?.votes || {}) };
  if (mine[optId] === dir) delete mine[optId]; else mine[optId] = dir;
  await guard(() => store.setVotes(p.id, who, mine));
}
async function rsvp(p, value) {
  const who = viewerId(p);
  const nickname = who === "preview-friend" ? "Preview friend" : (store.rsvps(p.id)[who]?.nickname || S.myName || "Someone");
  await guard(() => store.setRsvp(p.id, who, { value, nickname, at: Date.now() }));
}
async function addDemoFriend(p) {
  const taken = new Set(Object.values(store.rsvps(p.id)).map((r) => r.nickname));
  const name = DEMO_NAMES.find((n) => !taken.has(n)) || "Friend " + uid().slice(0, 3);
  const fid = "demo-" + uid();
  const votes = {};
  for (const o of p.options) { const r = hash(fid + o.id) % 10; if (r < 4) votes[o.id] = "up"; else if (r < 5) votes[o.id] = "down"; }
  await guard(async () => {
    await store.setRsvp(p.id, fid, { value: hash(fid) % 5 === 0 ? "out" : "in", nickname: name, at: Date.now() });
    await store.setVotes(p.id, fid, votes);
  });
}

/* ───────────── Rendering ───────────── */
const app = $("#app");
let newForm = null;
let sheet = null; // { kind: "name", planId }

function render() {
  const route = location.hash.slice(1);
  if (S.openPlan && S.openPlan !== route) { store.unwatchPlan(S.openPlan); S.openPlan = null; }
  const banner = modeBanner();
  if (route === "new") return paint(banner + viewNew());
  const plan = store.plans().find((p) => p.id === route);
  if (plan) { if (S.openPlan !== plan.id) { S.openPlan = plan.id; store.watchPlan(plan.id); } return paint(banner + viewPlan(plan)); }
  paint(banner + viewHome(route && route !== "home"));
}
function paint(html) {
  const focusId = document.activeElement?.id;
  app.innerHTML = html + (sheet ? viewSheet() : "");
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}
function bar(left, right) { return `<div class="bar"><div class="bar-row"><div>${left || ""}</div><div>${right || ""}</div></div></div>`; }

function modeBanner() {
  const note = S.note ? `<div class="banner warn" role="status">${esc(S.note)} <button class="btn sm gray" data-act="dismiss">OK</button></div>` : "";
  if (S.mode === "shared") return note + `<div class="banner"><strong>Shared test.</strong> Plans, RSVPs and votes here are live for everyone who opens this page. Availability is <strong>simulated</strong>.${S.canWrite ? "" : " You can view but not change shared plans."}</div>`;
  return note + `<div class="banner"><strong>Solo demo.</strong> Saved in this browser only. Use “Add a demo friend” to simulate the group. Availability is <strong>simulated</strong>.</div>`;
}

function viewHome(missing) {
  const plans = store.plans();
  const statusLabel = { CHECKING: "Checking…", RESULTS: "Options ready", NO_AVAILABILITY: "Nothing free", SELECTED: "Chosen · not booked", BOOKED: "Booked ✓", BOOKING_FAILED: "Booking fell through" };
  return bar("", S.canWrite ? `<a href="#new" aria-label="New plan" style="font-size:28px;line-height:1">+</a>` : "") +
    `<h1>Plans</h1>` +
    (missing ? `<div class="banner warn">That plan isn't here. It may have been deleted, or it's in another browser.</div>` : "") +
    (plans.length ? `<div class="section"><div class="card">${plans.map((p) => `
      <a class="row" href="#${esc(p.id)}" style="color:inherit;text-decoration:none">
        <div class="grow"><div class="trunc">${esc(CAT_LABEL[p.category])} · ${esc(fmtDate(p.date))}</div>
        <div class="small muted trunc">${esc(p.earliest)}–${esc(p.latest)} · ${p.partySize} people${p.organizerId === S.me ? " · you organise" : ""}</div></div>
        <span class="small muted">${esc(statusLabel[p.status] || p.status)}</span><span class="muted" aria-hidden="true">›</span></a>`).join("")}</div></div>`
      : `<div class="section"><div class="card" style="padding:28px 20px;text-align:center"><div class="headline" style="font-size:20px">No plans yet</div>
        <p class="small muted">Start one, then share this page with the group.</p>
        ${S.canWrite ? `<a href="#new" class="btn fill md" style="display:inline-grid;place-items:center;width:auto;padding:0 22px;text-decoration:none">What's the plan?</a>` : ""}</div></div>`) +
    `<p class="sf">Prototype of Plan: checked options, group votes, and the organiser picks. Nothing here books or charges anything.</p>`;
}

function viewNew() {
  const f = (newForm ||= { category: "padel", date: londonToday(1), earliest: "18:00", latest: "20:00", duration: 60, partySize: 4, areas: [], notes: "", error: "" });
  const areas = [...new Set(VENUES.filter((v) => v.cat === f.category).map((v) => v.area))];
  const times = Array.from({ length: 31 }, (_, i) => { const m = 420 + i * 30; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + (m % 60 ? "30" : "00"); });
  const sel = (id, val, opts) => `<select id="${id}" data-field="${id}">${opts.map(([v, l]) => `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${l}</option>`).join("")}</select>`;
  return bar(`<a href="#home">Cancel</a>`, "") + `<h1>What's the plan?</h1>
  <div class="section"><div class="sh">What</div><div class="card" style="padding:10px">
    <div class="seg" role="radiogroup" aria-label="Activity">${["padel", "tennis", "restaurant"].map((c) => `<button role="radio" aria-checked="${f.category === c}" data-act="cat" data-v="${c}">${CAT_LABEL[c]}</button>`).join("")}</div></div></div>
  <div class="section"><div class="sh">When</div><div class="card">
    <label class="row"><span class="grow">Date</span><input id="date" type="date" data-field="date" value="${f.date}" min="${londonToday()}"></label>
    <label class="row"><span class="grow">Earliest start</span>${sel("earliest", f.earliest, times.map((t) => [t, t]))}</label>
    <label class="row"><span class="grow">Latest start</span>${sel("latest", f.latest, times.map((t) => [t, t]))}</label>
    <label class="row"><span class="grow">Duration</span>${sel("duration", f.duration, [[60, "1 hour"], [90, "1½ hours"], [120, "2 hours"]])}</label>
  </div><div class="sf">London time. Each half hour in the window gets checked.</div></div>
  <div class="section"><div class="sh">Who</div><div class="card"><div class="row"><span class="grow">Party of <strong>${f.partySize}</strong></span>
    <div class="stepper" role="group" aria-label="Party size"><button data-act="size" data-v="-1" aria-label="Fewer people" ${f.partySize <= 1 ? "disabled" : ""}>−</button><span></span><button data-act="size" data-v="1" aria-label="More people" ${f.partySize >= 16 ? "disabled" : ""}>+</button></div></div></div></div>
  <div class="section"><div class="sh">Where</div><div class="card"><div class="chips">${areas.map((a) => `<button class="chip" aria-pressed="${f.areas.includes(a)}" data-act="area" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div></div>
    <div class="sf">Leave empty for anywhere.</div></div>
  <div class="section"><div class="sh">Notes (optional)</div><div class="card"><textarea id="notes" data-field="notes" rows="2" maxlength="280" placeholder="e.g. one veggie, no seafood">${esc(f.notes)}</textarea></div></div>
  ${f.error ? `<p class="err" role="alert">${esc(f.error)}</p>` : ""}
  <button class="btn fill" data-act="create">Find what's free</button>`;
}

function viewPlan(p) {
  const organiser = p.organizerId === S.me && !S.previewFriend;
  const me = viewerId(p);
  const rs = store.rsvps(p.id), vs = store.votes(p.id);
  const myRsvp = rs[me]?.value || null;
  const people = Object.entries(rs).sort((a, b) => a[1].at - b[1].at);
  const ins = people.filter(([, r]) => r.value === "in");
  const tally = {};
  for (const [who, v] of Object.entries(vs)) for (const [oid, dir] of Object.entries(v.votes || {})) { (tally[oid] ||= { up: 0, down: 0 })[dir]++; }
  const myVotes = vs[me]?.votes || {};
  const sel = p.options.find((o) => o.id === p.selectedOptionId);
  const canAct = S.canWrite;

  let body = `<div class="section"><div class="card"><div class="row" style="display:block;padding:14px 16px">
    <div class="headline">${esc(fmtDate(p.date, true))}</div>
    <div class="small muted">${esc(p.earliest)}–${esc(p.latest)} start · ${p.duration} min · ${p.partySize} ${p.partySize === 1 ? "person" : "people"}${p.areas.length ? " · " + esc(p.areas.join(", ")) : ""}</div>
    ${p.notes ? `<div class="small" style="margin-top:6px">“${esc(p.notes)}”</div>` : ""}</div></div></div>`;

  if (sel && (p.status === "SELECTED" || p.status === "BOOKED")) {
    body += `<div class="section"><div class="sh">${p.status === "BOOKED" ? "Booked" : "Selected"}</div><div class="card selected"><div style="padding:14px 16px" class="stack">
      <div class="headline">${esc(sel.venue)} · ${esc(fmtDate(p.date))} ${esc(sel.start)}–${esc(sel.end)}</div>
      ${p.status === "BOOKED"
        ? `<div style="color:var(--green);font-weight:600">Booked ✓ ${organiser ? "Reference " + esc(p.bookingRef) : "Reference on file with the organiser"}</div>`
        : organiser
          ? `<div class="small"><strong>Selected. Approve the final booking and terms with Instinct on WhatsApp. Nothing is booked yet.</strong></div>
             <div class="small muted">Quote <code class="id">REQ-${shortRef(p.id)}</code> option <code class="id">${shortRef(sel.id)}</code> · ${esc(sel.price || "price unknown")} · ${esc(sel.terms)}</div>
             <button class="btn tint md" data-act="copy" data-text="${esc(`Plan REQ-${shortRef(p.id)} option ${shortRef(sel.id)}: ${sel.venue}, ${fmtDate(p.date)} ${sel.start}-${sel.end}, ${p.partySize} people. ${sel.price || ""}`)}">Copy details for WhatsApp</button>`
          : `<div class="small"><strong>The organiser picked this.</strong> Nothing is booked yet. They're confirming it.</div>`}
    </div>
    ${organiser && p.status === "SELECTED" && canAct ? `<div style="padding:0 16px 14px" class="stack">
      <label class="tiny muted" for="ref">Booked it? Enter the venue's booking reference</label>
      <div style="display:flex;gap:8px"><input id="ref" type="text" placeholder="e.g. PT-123456" style="flex:1;min-width:0" data-field="ref" value="${esc(S.refDraft || "")}">
      <button class="btn green md" style="width:auto;padding:0 16px" data-act="booked" ${(S.refDraft || "").trim().length < 3 ? "disabled" : ""}>We're booked</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm gray" data-act="unselect">Pick another</button><button class="btn sm red" data-act="failed">Booking fell through</button></div></div>` : ""}
    </div></div>`;
  }

  if (p.status === "CHECKING") {
    body += `<div class="section"><div class="sh">Options</div><div class="card"><div class="row"><div class="spinner" aria-hidden="true"></div><span class="shimmer">Checking live availability…</span></div></div>
      <div class="sf">Simulated: takes a couple of seconds.</div></div>`;
  } else if (p.status === "NO_AVAILABILITY") {
    body += `<div class="section"><div class="sh">Options</div><div class="card"><div style="padding:14px 16px"><div class="headline">Nothing free in that window</div>
      <div class="small muted">Every venue was checked and none had space for ${p.partySize}. Try a wider window or a different day.</div></div>
      ${organiser && canAct ? `<div class="btns"><button class="btn tint md" data-act="recheck">Check again now</button></div>` : ""}</div></div>`;
  } else {
    body += `<div class="section"><div class="sh">Options · ${p.options.length}</div><div class="card">${p.options.map((o) => {
      const a = age(o.checkedAt), t = tally[o.id] || { up: 0, down: 0 }, chosen = o.id === p.selectedOptionId;
      return `<div class="opt">
        <div class="opt-top"><div style="min-width:0"><div class="headline trunc">${esc(o.venue)}</div>
          <div class="small muted">${esc(fmtDate(p.date))} · ${esc(o.start)}–${esc(o.end)} · ${esc(o.area)}</div>
          <div class="small">${esc(o.desc)}${o.price ? " · " + esc(o.price) : ""}</div></div>${chosen ? `<span class="badge blue">Chosen</span>` : ""}</div>
        <div class="opt-bottom"><span class="badge ${a.older ? "orange" : "green"}">${a.older ? "Older check · " + a.text : "✓ Checked " + a.text} · simulated</span>
          <div class="votes">
            <button class="pill up" aria-pressed="${myVotes[o.id] === "up"}" aria-label="Thumbs up, ${t.up}" data-act="vote" data-o="${o.id}" data-v="up" ${canAct ? "" : "disabled"}>👍${t.up ? " " + t.up : ""}</button>
            <button class="pill down" aria-pressed="${myVotes[o.id] === "down"}" aria-label="Thumbs down, ${t.down}" data-act="vote" data-o="${o.id}" data-v="down" ${canAct ? "" : "disabled"}>👎${t.down ? " " + t.down : ""}</button></div></div>
        ${organiser && canAct && !chosen && (p.status === "RESULTS" || p.status === "SELECTED" || p.status === "BOOKING_FAILED") ? `<div style="margin-top:10px"><button class="btn tint md" data-act="choose" data-o="${o.id}">Choose this option</button></div>` : ""}
        ${organiser ? `<div class="tiny" style="color:var(--label3);margin-top:8px;overflow-wrap:anywhere">Source: ${esc(o.source)}</div>` : ""}
      </div>`; }).join("")}
      ${organiser && canAct && p.status !== "BOOKED" ? `<div class="btns"><button class="btn tint md" data-act="recheck">Check again now</button></div>` : ""}
    </div><div class="sf">A check is a snapshot, not a hold. Nothing is booked until the venue confirms.</div></div>`;
  }

  body += `<div class="section"><div class="sh">Who's in · ${ins.length}/${p.partySize}</div><div class="card">
    ${canAct && p.status !== "BOOKED" ? `<div class="btns"><button class="btn ${myRsvp === "in" ? "green" : "fill"} md" data-act="rsvp" data-v="in">${myRsvp === "in" ? "You're in ✓" : "I'm in"}</button>
      <button class="btn gray md" data-act="rsvp" data-v="out" ${myRsvp === "out" ? 'style="box-shadow:inset 0 0 0 2px var(--label3)"' : ""}>Can't make it</button></div>` : ""}
    ${people.map(([who, r]) => `<div class="row">${avatar(r.nickname, who)}<span class="grow trunc">${esc(r.nickname)}${who === me ? " (you)" : ""}</span><span class="small muted">${r.value === "in" ? "In" : "Out"}</span></div>`).join("")}
  </div>${ins.length > p.partySize ? `<div class="sf" style="color:var(--orange)">${ins.length} are in but the booking is for ${p.partySize}. Start a new plan for ${ins.length} if everyone's coming.</div>` : ""}</div>`;

  if (organiser || (p.organizerId === S.me && S.previewFriend)) {
    body += `<div class="section"><div class="sh">Testing tools</div><div class="card dev"><div class="btns">
      <button class="btn sm gray" data-act="demo-friend" ${canAct && p.options.length ? "" : "disabled"}>Add a demo friend</button>
      <button class="btn sm gray" data-act="age" ${canAct && p.options.length ? "" : "disabled"}>Make checks 20 min older</button>
      <button class="btn sm gray" data-act="preview">${S.previewFriend ? "Back to organiser view" : "Preview as a friend"}</button>
      ${canAct ? `<button class="btn sm red" data-act="delete">${S.confirmDelete === p.id ? "Tap again to delete" : "Delete plan"}</button>` : ""}
    </div></div><div class="sf">${S.mode === "shared" ? "To test with real friends, share this artifact with them (Contributor access lets them vote) and send them to plan " : "Solo demo: everything stays in this browser. Plan "}<code class="id">${esc(p.id)}</code>.</div></div>`;
  }

  const title = `${CAT_LABEL[p.category]} · ${fmtDate(p.date)}`;
  return bar(`<a href="#home">‹ Plans</a>`, "") + `<h1>${esc(title)}</h1>` + (S.previewFriend && p.organizerId === S.me ? `<div class="banner">Previewing as a friend. Organiser controls are hidden.</div>` : "") + body;
}

function viewSheet() {
  return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-stop>
    <div class="grabber"></div><h2 id="sheet-title">What should we call you?</h2>
    <div class="stack"><input id="nick" type="text" maxlength="40" placeholder="Your name" value="${esc(S.myName)}" autocomplete="given-name">
    <button class="btn fill" data-act="save-name">Continue</button>
    <p class="tiny muted" style="text-align:center;margin:0">Only shown to people on this plan.</p></div></div></div>`;
}

/* ───────────── Events ───────────── */
app.addEventListener("input", (e) => {
  const f = e.target.dataset.field;
  if (!f) return;
  if (f === "ref") { S.refDraft = e.target.value; const b = $('[data-act="booked"]'); if (b) b.disabled = S.refDraft.trim().length < 3; return; }
  if (newForm) newForm[f] = e.target.value;
});
app.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "close-sheet" && e.target.closest("[data-stop]")) return;
  const route = location.hash.slice(1);
  const p = store.plans().find((x) => x.id === route);
  const act = el.dataset.act;
  if (act === "dismiss") { S.note = null; return render(); }
  if (act === "cat") { newForm.category = el.dataset.v; newForm.areas = []; return render(); }
  if (act === "size") { newForm.partySize = Math.min(16, Math.max(1, newForm.partySize + +el.dataset.v)); return render(); }
  if (act === "area") { const a = el.dataset.v; newForm.areas = newForm.areas.includes(a) ? newForm.areas.filter((x) => x !== a) : [...newForm.areas, a]; return render(); }
  if (act === "create") {
    const f = newForm;
    f.error = !f.date || f.date < londonToday() ? "Pick today or a later date." : f.latest < f.earliest ? "Latest start is before earliest start." : "";
    if (f.error) return render();
    const data = { ...f }; newForm = null;
    return createPlan(data);
  }
  if (act === "close-sheet") { sheet = null; return render(); }
  if (act === "save-name") { const v = $("#nick").value.trim(); if (!v) return; S.myName = v; const pending = sheet.then; sheet = null; render(); return pending && pending(); }
  if (!p) return;
  if (act === "vote") return vote(p, el.dataset.o, el.dataset.v);
  if (act === "rsvp") {
    const run = () => rsvp(p, el.dataset.v);
    if (S.mode === "shared" && !store.rsvps(p.id)[viewerId(p)] && !S.myName && !S.previewFriend) { sheet = { then: run }; return render(); }
    return run();
  }
  if (act === "choose") return guard(() => store.patchPlan(p.id, { status: "SELECTED", selectedOptionId: el.dataset.o }));
  if (act === "unselect") return guard(() => store.patchPlan(p.id, { status: "RESULTS", selectedOptionId: null }));
  if (act === "failed") return guard(() => store.patchPlan(p.id, { status: "BOOKING_FAILED", selectedOptionId: null }));
  if (act === "booked") { const ref = (S.refDraft || "").trim(); if (ref.length < 3) return; S.refDraft = ""; return guard(() => store.patchPlan(p.id, { status: "BOOKED", bookingRef: ref })); }
  if (act === "recheck") return recheck(p);
  if (act === "age") return ageChecks(p);
  if (act === "demo-friend") return addDemoFriend(p);
  if (act === "preview") { S.previewFriend = !S.previewFriend; return render(); }
  if (act === "delete") {
    if (S.confirmDelete !== p.id) { S.confirmDelete = p.id; return render(); }
    S.confirmDelete = null; location.hash = "home"; return guard(() => store.deletePlan(p.id));
  }
  if (act === "copy") {
    const text = el.dataset.text;
    try { await navigator.clipboard.writeText(text); el.textContent = "Copied ✓"; }
    catch { el.outerHTML = `<div class="tiny" style="user-select:all;padding:8px;background:var(--fill);border-radius:8px">${esc(text)}</div>`; }
  }
});

/* Finish any check this organiser started but didn't complete (e.g. page closed mid-check). */
setInterval(() => {
  if (!store) return;
  for (const p of store.plans()) if (p.status === "CHECKING" && p.organizerId === S.me && Date.now() - (p.updatedAt || 0) > 4000) finishCheck(p.id);
}, 3000);

boot();
</script>
